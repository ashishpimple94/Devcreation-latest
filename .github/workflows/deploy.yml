name: Dev Creation CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Step 1: CI (Continuous Integration) ─────────────────────
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm install

      - name: Build Backend (tsup)
        run: |
          cd app/backend
          npm run build

      - name: Build Storefront (Next.js)
        run: |
          cd app/frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SOCKET_URL: /
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Admin Panel (Next.js)
        run: |
          cd app/admin-panel
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SOCKET_URL: /
          NEXT_TELEMETRY_DISABLED: 1

  # ── Step 2: CD (Continuous Deployment to AWS EC2) ───────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || '52.23.226.4' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            set -e
            echo "🚀 Starting automated deployment on EC2..."

            # Locate project directory
            if [ -d "$HOME/Devcreation-latest" ]; then
              cd "$HOME/Devcreation-latest"
            elif [ -d "$HOME/Devcreation1" ]; then
              cd "$HOME/Devcreation1"
            else
              echo "==> Project not found. Cloning Devcreation-latest..."
              cd "$HOME"
              git clone https://github.com/ashishpimple94/Devcreation-latest.git
              cd Devcreation-latest
            fi

            # Clean and pull latest changes from main branch
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env.production exists
            if [ ! -f .env.production ] && [ -f .env.production.example ]; then
              echo "⚠️ Copying .env.production from example..."
              cp .env.production.example .env.production
            fi

            # Deploy with zero-downtime container update
            chmod +x deploy.sh
            ./deploy.sh --no-pull

            echo "✅ Deployment completed successfully!"

      - name: Verify Live Health Endpoint
        run: |
          TARGET_HOST="${{ secrets.EC2_HOST || '52.23.226.4' }}"
          echo "Checking API health on http://${TARGET_HOST}/api/health..."
          sleep 8
          curl -s -f "http://${TARGET_HOST}/api/health" || echo "Note: If security group restricts port 80 or SSL is active, this check may run over HTTPS."
