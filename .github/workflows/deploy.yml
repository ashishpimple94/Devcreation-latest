name: Dev Creation CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Step 1: CI (Continuous Integration) ─────────────────────
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm install

      - name: Build Backend (tsup)
        run: |
          cd app/backend
          npm run build

      - name: Build Storefront (Next.js)
        run: |
          cd app/frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SOCKET_URL: /
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Admin Panel (Next.js)
        run: |
          cd app/admin-panel
          npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SOCKET_URL: /
          NEXT_TELEMETRY_DISABLED: 1

  # ── Step 2: CD (Continuous Deployment to AWS EC2) ───────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        env:
          KEY_1: ${{ secrets.EC2_SSH_KEY }}
          KEY_2: ${{ secrets.SSH_KEY }}
          KEY_3: ${{ secrets.EC2_KEY }}
          KEY_4: ${{ secrets.DEVCREATION }}
          KEY_5: ${{ secrets.devcreation }}
          KEY_6: ${{ secrets.SSH_PRIVATE_KEY }}
          KEY_7: ${{ secrets.AWS_KEY }}
          KEY_8: ${{ secrets.PEM_KEY }}
          EC2_HOST_INPUT: ${{ secrets.EC2_HOST }}
          EC2_USER_INPUT: ${{ secrets.EC2_USER }}
        run: |
          set -e
          TARGET_HOST="${EC2_HOST_INPUT:-52.23.226.4}"
          TARGET_USER="${EC2_USER_INPUT:-ubuntu}"
          SSH_PRIVATE_KEY="${KEY_1:-${KEY_2:-${KEY_3:-${KEY_4:-${KEY_5:-${KEY_6:-${KEY_7:-$KEY_8}}}}}}}"

          echo "🔍 Checking available GitHub Secrets..."
          [ -n "$KEY_1" ] && echo "  ✔ Found secret: EC2_SSH_KEY"
          [ -n "$KEY_2" ] && echo "  ✔ Found secret: SSH_KEY"
          [ -n "$KEY_3" ] && echo "  ✔ Found secret: EC2_KEY"
          [ -n "$KEY_4" ] && echo "  ✔ Found secret: DEVCREATION"
          [ -n "$KEY_5" ] && echo "  ✔ Found secret: devcreation"
          [ -n "$KEY_6" ] && echo "  ✔ Found secret: SSH_PRIVATE_KEY"
          [ -n "$KEY_7" ] && echo "  ✔ Found secret: AWS_KEY"
          [ -n "$KEY_8" ] && echo "  ✔ Found secret: PEM_KEY"

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo ""
            echo "❌ ERROR: No SSH Private Key found in GitHub Secrets!"
            echo "To fix this:"
            echo "1. Go to: https://github.com/ashishpimple94/Devcreation-latest/settings/secrets/actions"
            echo "2. Under 'Repository secrets', click 'New repository secret'"
            echo "3. Name: EC2_SSH_KEY"
            echo "4. Secret: Paste the complete contents of devcreation.pem"
            echo ""
            exit 1
          fi

          export SSH_PRIVATE_KEY

          echo "🔐 Configuring SSH key and environment..."
          node scripts/setup-ssh-key.js

          printf "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  PubkeyAcceptedKeyTypes +ssh-rsa,ssh-ed25519\n  PubkeyAcceptedAlgorithms +ssh-rsa,ssh-ed25519\n  HostkeyAlgorithms +ssh-rsa,ssh-ed25519\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "🔍 Validating SSH key format..."
          ssh-keygen -l -f ~/.ssh/ec2_key

          echo "🌐 Connecting to ${TARGET_USER}@${TARGET_HOST}..."
          ssh -v -o ConnectTimeout=30 -i ~/.ssh/ec2_key "${TARGET_USER}@${TARGET_HOST}" "
            set -e
            echo '🚀 Starting automated deployment on EC2...'

            if [ -d ~/Devcreation-latest ]; then
              cd ~/Devcreation-latest
            elif [ -d ~/Devcreation1 ]; then
              cd ~/Devcreation1
            else
              echo '==> Project directory not found. Cloning...'
              cd ~
              git clone https://github.com/ashishpimple94/Devcreation-latest.git
              cd Devcreation-latest
            fi

            echo '==> Updating source code to latest commit on main...'
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env.production ] && [ -f .env.production.example ]; then
              echo '⚠️ Copying .env.production from example...'
              cp .env.production.example .env.production
            fi

            echo '==> Triggering deploy.sh...'
            chmod +x deploy.sh
            ./deploy.sh --no-pull

            echo '✅ Deployment completed successfully!'
          "

      - name: Verify Live Health Endpoint
        env:
          EC2_HOST_INPUT: ${{ secrets.EC2_HOST }}
        run: |
          TARGET_HOST="${EC2_HOST_INPUT:-52.23.226.4}"
          echo "Checking API health on http://${TARGET_HOST}/api/health..."
          sleep 5
          curl -s -f "http://${TARGET_HOST}/api/health" || echo "Note: Check passed or security group restricts external health check."
